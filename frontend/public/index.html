<!doctype html>
<html lang="pt-PT">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#050505" />
        <meta name="description" content="SUBMUNDO - O teu império criminal começa aqui" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <title>SUBMUNDO</title>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
        <script>
            if (window.self !== window.top) {
                var debugMonitorScript = document.createElement('script');
                debugMonitorScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugMonitorScript);
                window.tailwind = window.tailwind || {};
                tailwind.config = { corePlugins: { preflight: false } };
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
        <style>
            body { background-color: #050505; }
            .loader {
                width: 48px;
                height: 48px;
                border: 3px solid #333;
                border-bottom-color: #FF003C;
                border-radius: 50%;
                display: inline-block;
                animation: rotation 1s linear infinite;
            }
            @keyframes rotation {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
        <script>
            (function() {
                var observer = new MutationObserver(function(mutations) {
                    var badge = document.getElementById('emergent-badge');
                    if (badge) badge.parentNode.removeChild(badge);
                    document.querySelectorAll('a[href*="emergent"]').forEach(function(el) { 
                        if (el.parentNode) el.parentNode.removeChild(el); 
                    });
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
                document.addEventListener('DOMContentLoaded', function() {
                    var badge = document.getElementById('emergent-badge');
                    if (badge) badge.parentNode.removeChild(badge);
                });
                window.addEventListener('load', function() {
                    var badge = document.getElementById('emergent-badge');
                    if (badge) badge.parentNode.removeChild(badge);
                });
            })();
        </script>
    </head>
    <body>
        <noscript>Precisas de JavaScript para jogar SUBMUNDO.</noscript>
        <div id="root">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #E0E0E0; font-family: 'Chakra Petch', sans-serif;">
                <span class="loader"></span>
                <p style="margin-top: 20px; text-transform: uppercase; letter-spacing: 0.2em;">A carregar...</p>
            </div>
        </div>
<!-- Badge removed -->
    </body>
</html>

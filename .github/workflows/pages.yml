name: Deploy SUBMUNDO to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate lucide-react imports
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const exported = new Set(Object.keys(require('lucide-react')));
          const missing = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(js|jsx|ts|tsx)$/.test(entry.name)) {
                const source = fs.readFileSync(full, 'utf8');
                const regex = /import\s*\{([^}]*)\}\s*from\s*['"]lucide-react['"];?/g;
                let match;
                while ((match = regex.exec(source))) {
                  for (const raw of match[1].split(',')) {
                    const spec = raw.trim();
                    if (!spec) continue;
                    const imported = spec.split(/\s+as\s+/)[0].trim();
                    if (imported && !exported.has(imported)) {
                      missing.push(`${full}: ${imported}`);
                    }
                  }
                }
              }
            }
          }

          walk('src');
          if (missing.length) {
            console.error('Invalid lucide-react imports:\n' + [...new Set(missing)].join('\n'));
            process.exit(1);
          }
          console.log('All lucide-react imports are valid.');
          NODE

      - name: Build frontend
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://mafia-dashboard.preview.emergentagent.com"
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
